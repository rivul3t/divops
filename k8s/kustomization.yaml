apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vpshub

resources:
  - namespace.yaml
  - postgres-secret.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: db-init
    files:
      - tables.sql=../tsu_vps_service/sql/tables.sql
