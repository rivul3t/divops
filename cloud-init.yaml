#cloud-config
hostname: ${hostname}
preserve_hostname: false

users:
  - name: devops
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
%{ for key in ssh_keys ~}
      - ${key}
%{ endfor ~}

package_update: true
packages:
  - ca-certificates
  - curl
  - git

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker devops
  - systemctl enable --now docker
