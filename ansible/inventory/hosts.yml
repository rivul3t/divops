---
# Single-node k3s: one server, no agents.
# Put the IP of the one working machine below. To add agents later, uncomment
# the agent block and add hosts in the same format as server.
k3s_cluster:
  children:
    server:
      hosts:
        nikita.perminov:
          ansible_host: 192.168.71.12
#    agent:
#      hosts:
#        valeriya.yakovleva:
#          ansible_host: 192.168.71.9
#        danila.shemetov:
#          ansible_host: 192.168.71.13

  # Required by the k3s.orchestration collection. Kept here (not in group_vars)
  # so the whole deploy config lives in one self-contained file.
  vars:
    k3s_version: v1.31.12+k3s1
    # API endpoint agents use to reach the control-plane: the server node IP.
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    # token is omitted on purpose: a single server generates its own.
