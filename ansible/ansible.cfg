[defaults]
inventory            = inventory/hosts.yml
remote_user          = rivulet
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = default
result_format        = yaml
interpreter_python   = auto_silent
roles_path           = roles

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
pipelining = True
