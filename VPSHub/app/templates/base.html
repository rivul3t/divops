<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}{{ app_name }}{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"><script src="{{ url_for('static', path='app.js') }}" defer></script></head>
<body><header class="header"><a class="brand" href="/"><span class="logo">V</span>{{ app_name }}<small>учебный провайдер</small></a><nav aria-label="Основное меню"><a href="/">Тарифы</a><a href="/orders">Мои заявки</a><a href="/admin{% if not is_admin %}/login{% endif %}">Менеджер</a>{% if is_admin %}<form action="/admin/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Выйти</button></form>{% endif %}</nav></header>
<main>{% block content %}{% endblock %}</main><footer>VPSHub · Учебный сервис. Заказы сохраняются как заявки. Оплата и выделение VPS не выполняются.</footer></body></html>
